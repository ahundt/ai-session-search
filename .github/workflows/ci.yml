name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  UV_VERSION: 0.11.28

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
      - name: Select the PyO3 build interpreter explicitly
        shell: bash
        run: echo "PYO3_PYTHON=$(uv python find 3.12)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run pytest -m "not integration" --tb=short
        env:
          AI_SESSION_SEARCH_CONFIG_DIR: ${{ runner.temp }}/aise-config
          AI_SESSION_SEARCH_CACHE_DIR: ${{ runner.temp }}/aise-cache
          CLAUDE_CONFIG_DIR: ${{ github.workspace }}/tests/aise-demo
          NO_COLOR: '1'
      - run: uv run maturin build --release --locked --out dist
      - run: uv run python scripts/verify_release_artifacts.py dist/*.whl
        shell: bash
      - name: Import the built wheel outside the source environment
        shell: bash
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          uv run --isolated --no-project --with "$wheel" python -c \
            "import ai_session_search, ai_session_search._native; print(ai_session_search.__version__)"
