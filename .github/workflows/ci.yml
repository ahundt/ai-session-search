name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12
  CARGO_DENY_VERSION: 0.20.2
  UV_VERSION: 0.11.28
  ZIZMOR_VERSION: 1.26.1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  workflow-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # Installed from the module proxy, whose checksum database verifies the pinned version.
      # A release tarball would need its own checksum recorded and refreshed here instead.
      - name: Install actionlint
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # No file arguments, so a workflow added later is checked without editing this job.
      # shellcheck is preinstalled on the runner, so actionlint also lints every `run:` body.
      - name: Check workflow syntax, expressions, and shell bodies
        run: actionlint
      # shellcheck only understands POSIX shells, so actionlint never parses a
      # `shell: pwsh` body. PowerShell is preinstalled on this runner.
      - name: Parse the PowerShell run bodies actionlint cannot
        run: uv run --script scripts/check_workflow_powershell.py
      - name: Audit workflow security without GitHub API access
        run: uv tool run --from 'zizmor==${{ env.ZIZMOR_VERSION }}' zizmor --offline .

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
      - name: Select the PyO3 build interpreter explicitly
        shell: bash
        run: echo "PYO3_PYTHON=$(uv python find 3.12)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: uv run --no-project python scripts/render_message_search_docs.py --check --aise target/debug/aise
      - run: cargo test -p ai-session-search -p ai-session-search-api-consumer --doc --all-features --locked
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  rust-msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: msrv-1.88.0
      - run: cargo test -p ai-session-search --lib --locked --no-run
      - run: cargo check -p ai-session-search-api-consumer --lib --locked

  rust-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: rust-portability
      - name: Exercise native filesystem, process, installer, and path behavior
        run: cargo test -p ai-session-search --all-targets --locked
      # The shipped PowerShell installer was previously executed only by the
      # publish workflow's Windows native job, so a tag push was the first thing
      # that ever ran it. PowerShell is preinstalled on both runners here.
      - name: Exercise the native PowerShell installer
        shell: pwsh
        run: ./scripts/test_install_native_ps1.ps1

  rust-install:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: install-contracts
      - name: Package and verify the publishable crate
        run: cargo package -p ai-session-search --locked
      - name: Install and smoke-test registry, path, and Git source shapes
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-install-target
        run: |
          package_dir=$(find target/package -mindepth 1 -maxdepth 1 -type d -name 'ai-session-search-*' -print -quit)
          test -n "$package_dir"

          cargo install --path "$package_dir" \
            --root '${{ runner.temp }}/cargo-package-install' --locked --offline
          uv run --isolated --no-project python scripts/verify_native_executable.py \
            --executable '${{ runner.temp }}/cargo-package-install/bin/aise'

          cargo install --path rust/ai-session-search-core \
            --root '${{ runner.temp }}/cargo-path-install' --locked
          uv run --isolated --no-project python scripts/verify_native_executable.py \
            --executable '${{ runner.temp }}/cargo-path-install/bin/aise'

          cargo install ai-session-search --git "file://$GITHUB_WORKSPACE" \
            --rev "$GITHUB_SHA" --root '${{ runner.temp }}/cargo-git-install' --locked
          uv run --isolated --no-project python scripts/verify_native_executable.py \
            --executable '${{ runner.temp }}/cargo-git-install/bin/aise'

      - name: Verify pip and uv installation from the exact Git commit
        shell: bash
        run: |
          uv run --isolated --no-project python scripts/verify_python_install_methods.py \
            --git-url "file://$GITHUB_WORKSPACE" \
            --git-rev "$GITHUB_SHA" \
            --source-root "$GITHUB_WORKSPACE" \
            --timeout-seconds 600

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14']
        include:
          - os: ubuntu-24.04-arm
            python-version: '3.12'
          - os: macos-15-intel
            python-version: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      - run: uv run mypy ai_session_search tests
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      - run: uv run python -m mypy.stubtest ai_session_search --concise --ignore-disjoint-bases
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      - name: Create isolated test configuration
        shell: bash
        env:
          AI_SESSION_SEARCH_CONFIG: ${{ runner.temp }}/aise-config/config.toml
        run: >-
          uv run python -c 'import os; from pathlib import Path;
          path = Path(os.environ["AI_SESSION_SEARCH_CONFIG"]);
          path.parent.mkdir(parents=True, exist_ok=True);
          path.write_text("", encoding="utf-8")'
      - run: uv run pytest -m "not integration" --tb=short
        env:
          AI_SESSION_SEARCH_CONFIG: ${{ runner.temp }}/aise-config/config.toml
          AI_SESSION_SEARCH_CACHE_DIR: ${{ runner.temp }}/aise-cache
          CLAUDE_CONFIG_DIR: ${{ github.workspace }}/tests/aise-demo
          NO_COLOR: '1'
      - run: uv run maturin build --release --locked --out dist
      - run: uv run python -m scripts.verify_release_artifacts dist/*.whl
        shell: bash
      - name: Smoke-test the exact wheel outside the source environment
        shell: bash
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          uv run --isolated --no-project --with "$wheel" \
            python scripts/verify_installed_distribution.py \
              --source-root "$GITHUB_WORKSPACE"
      - name: Verify pip, uv add, uv tool, and uvx install pathways
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          uv run --isolated --no-project python scripts/verify_python_install_methods.py \
            --artifact "$wheel" \
            --source-root "$GITHUB_WORKSPACE"

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - run: uv sync --locked --no-dev
      - run: uv run --no-sync python scripts/python_license_inventory.py --output python-runtime-licenses.md
      - run: cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
      - run: cargo deny --locked check advisories licenses sources bans
      - run: cargo deny list > rust-dependency-licenses.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-license-inventories
          path: |
            python-runtime-licenses.md
            rust-dependency-licenses.txt
          if-no-files-found: error
