name: Build and publish distributions

on:
  push:
    tags: ['v*']
  # Rehearse the Python half against TestPyPI. Dispatch this against the
  # release tag itself, so the rehearsal builds the same commit the release
  # will. It publishes only to TestPyPI: crates.io has no test registry, and
  # the production publish and GitHub Release jobs stay bound to a tag push.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_CYCLONEDX_VERSION: 0.5.9
  UV_VERSION: 0.11.28

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # The same gate writes the release body it just proved exists, so the notes the
      # release publishes are the section this job validated rather than a second reading.
      - name: Require tag and package versions to match
        run: >-
          python -m scripts.verify_release_metadata
          --tag "$GITHUB_REF_NAME" --notes-out release-notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  crate:
    needs: [test, metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - name: Build the publishable crate twice and require deterministic bytes
        shell: bash
        run: |
          cargo package -p ai-session-search --locked \
            --target-dir '${{ runner.temp }}/crate-first'
          cargo package -p ai-session-search --locked --no-verify \
            --target-dir '${{ runner.temp }}/crate-second'
          first=$(find '${{ runner.temp }}/crate-first/package' -maxdepth 1 -name '*.crate' -print -quit)
          second=$(find '${{ runner.temp }}/crate-second/package' -maxdepth 1 -name '*.crate' -print -quit)
          test -n "$first" && test -n "$second"
          cmp "$first" "$second"
          mkdir dist
          cp "$first" dist/
          python -m scripts.verify_release_artifacts dist/*.crate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: crate
          path: dist/*.crate
          if-no-files-found: error

  wheels:
    needs: [test, metadata]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: '2014'
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: '2014'
          - os: macos-14
            target: aarch64
            manylinux: auto
          - os: macos-15-intel
            target: x86_64
            manylinux: auto
          - os: windows-latest
            target: x64
            manylinux: auto
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
          enable-cache: false
      # maturin stamps the PEP 770 SBOM it embeds in the wheel with the build clock
      # and a fresh serialNumber, which is the only thing that made two builds of the
      # same commit differ: measured locally, exporting this makes the whole wheel
      # byte-identical across builds. The native job already pins the same variable.
      - name: Pin the build timestamp to the commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          # Without this the action installs `latest`, so the published wheels are built
          # by whatever maturin shipped that day while every test runs the version
          # pyproject pins. Pinning the build tool is what makes SOURCE_DATE_EPOCH mean
          # anything: a fixed clock cannot make two different compilers agree.
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          command: build
          args: --release --locked --out dist
          # The manylinux targets build inside a container, which does not inherit the
          # runner environment, so the variable has to be forwarded explicitly.
          docker-options: -e SOURCE_DATE_EPOCH
      # maturin records the workspace crates in the wheel's embedded PEP 770 SBOM as
      # path+file://<checkout>/rust/<crate>, so every runner's checkout path shipped inside
      # the first release's wheels. This is the same rewrite the sbom job applies to the
      # loose SBOMs, giving workspace:<relative>; the manylinux container mounts the checkout
      # at the runner's own path, so one --root covers every matrix entry. RECORD is updated
      # for the member and the pinned build clock is left alone, so the checks below still
      # hold. The verify step and the verify job both reject a wheel that skipped this.
      - name: Rewrite the embedded SBOM's checkout paths as workspace-relative
        shell: bash
        run: >-
          uv run --isolated --no-project python scripts/sanitize_sboms.py
          --root "$GITHUB_WORKSPACE" dist/*.whl
      # Exporting the variable and forwarding it into the container are two separate
      # claims, and only the wheel itself can settle the second. maturin writes the epoch
      # into the embedded SBOM's metadata.timestamp and drops serialNumber when it sees
      # it, so comparing that timestamp proves the build received the pin. Without this a
      # container that never got the variable still produces a wheel that installs and
      # passes every other check, and is simply not reproducible from its commit.
      - name: Verify the wheel and that the build observed the pinned clock
        shell: bash
        run: >-
          uv run --isolated --no-project python -m scripts.verify_release_artifacts
          --source-date-epoch "$SOURCE_DATE_EPOCH" dist/*.whl
      - name: Smoke-test the exact wheel on its matching native runner
        shell: bash
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          uv run --isolated --no-project --with "$wheel" \
            python scripts/verify_installed_distribution.py \
              --source-root "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  native:
    needs: [test, metadata]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: target/release/aise
            archive-format: tar.gz
            installer: scripts/install-native.sh
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            executable: target/release/aise
            archive-format: tar.gz
            installer: scripts/install-native.sh
          - os: macos-14
            target: aarch64-apple-darwin
            executable: target/release/aise
            archive-format: tar.gz
            installer: scripts/install-native.sh
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: target/release/aise
            archive-format: tar.gz
            installer: scripts/install-native.sh
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: target/release/aise.exe
            archive-format: zip
            installer: scripts/install-native.ps1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
          enable-cache: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - run: cargo build --release --locked -p ai-session-search --bin aise
      - name: Smoke-test the native CLI and MCP server with isolated state
        shell: bash
        run: >-
          uv run --isolated --no-project python scripts/verify_native_executable.py
          --executable '${{ matrix.executable }}'
      - name: Package and verify the native archive
        shell: bash
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            uv run --isolated --no-project python scripts/package_native_release.py \
              --binary '${{ matrix.executable }}' \
              --license LICENSE \
              --notice NOTICE \
              --installer '${{ matrix.installer }}' \
              --output-dir dist \
              --version "${GITHUB_REF_NAME#v}" \
              --target '${{ matrix.target }}' \
              --format '${{ matrix.archive-format }}'
          uv run --isolated --no-project python -m scripts.verify_release_artifacts dist/*
      - name: Install and smoke-test the exact Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          bundle_name=$(basename "$archive" .tar.gz)
          mkdir '${{ runner.temp }}/native-archive'
          tar -xzf "$archive" -C '${{ runner.temp }}/native-archive'
          sh '${{ runner.temp }}/native-archive/'"$bundle_name"/install.sh \
            --bin-dir '${{ runner.temp }}/native-bin'
          uv run --isolated --no-project python scripts/verify_native_executable.py \
            --executable '${{ runner.temp }}/native-bin/aise'
      - name: Install and smoke-test the exact Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = (Get-ChildItem -Path dist -Filter '*.zip' | Select-Object -First 1).FullName
          $extract = Join-Path '${{ runner.temp }}' 'native-archive'
          $bin = Join-Path '${{ runner.temp }}' 'native-bin'
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $bundle = Get-ChildItem -Path $extract -Directory | Select-Object -First 1
          & (Join-Path $bundle.FullName 'install.ps1') -BinDir $bin
          $executable = Join-Path $bin 'aise.exe'
          uv run --isolated --no-project python scripts/verify_native_executable.py --executable $executable
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  sdist:
    needs: [test, metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
          enable-cache: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          maturin-version: v1.14.1
          command: sdist
          args: --out dist
      - name: Build and smoke-test the exact sdist in isolation
        shell: bash
        run: |
          sdist=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          uv run --isolated --no-project --with "$sdist" \
            python scripts/verify_installed_distribution.py \
              --source-root "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  sbom:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - name: Generate locked Python dependency SBOM
        run: |
          mkdir sbom
          uv export --locked --no-dev --format cyclonedx1.5 \
            --output-file sbom/ai-session-search-python-runtime.cdx.json
      - name: Generate locked Rust dependency SBOMs
        shell: bash
        run: |
          cargo install cargo-cyclonedx \
            --version "$CARGO_CYCLONEDX_VERSION" --locked
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            cargo cyclonedx --manifest-path Cargo.toml --format json \
              --spec-version 1.5 --target all --all-features --all
          find rust -maxdepth 3 -name '*.cdx.json' -exec cp '{}' sbom/ ';'
          test "$(find sbom -maxdepth 1 -name '*.cdx.json' | wc -l)" -eq 3
          python scripts/sanitize_sboms.py --root "$GITHUB_WORKSPACE" \
            --source-date-epoch "$(git log -1 --format=%ct)" sbom/*.cdx.json
          if grep -R -F 'path+file://' sbom; then
            echo "machine-local path leaked into SBOM" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-sboms
          path: sbom/*.cdx.json
          if-no-files-found: error

  verify:
    needs: [wheels, native, sdist, crate, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: 'wheel-*'
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sdist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: crate
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: 'native-*'
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dependency-sboms
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dependency-license-inventories
          path: dist
      - name: Verify every distribution and the complete expected release set
        shell: bash
        run: >-
          python -m scripts.verify_release_artifacts
          --release-set --version "${GITHUB_REF_NAME#v}" dist/*
      - run: (cd dist && sha256sum -- * > SHA256SUMS)
      # A real release only. This action has no dry-run — every invocation persists an
      # attestation in the repository's list, and there is no API to remove one — so a
      # TestPyPI rehearsal would leave a permanent entry for a release that never happened.
      # The rehearsal still checks what it can: the step above verifies the exact release set
      # at this same subject-path, and publish-testpypi signs PEP 740 attestations through the
      # same OIDC identity onto the disposable test registry.
      - if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-python-distributions
          path: |
            dist/*.whl
            dist/ai_session_search-*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-native-distributions
          path: |
            dist/ai-session-search-*.tar.gz
            dist/ai-session-search-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-crate-distribution
          path: dist/*.crate
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-release-metadata
          path: |
            dist/*.cdx.json
            dist/*.md
            dist/*.txt
            dist/SHA256SUMS
          if-no-files-found: error

  publish-crate:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-crate-distribution
          path: dist
      - name: Reproduce the attested crate before requesting registry credentials
        shell: bash
        run: |
          cargo package -p ai-session-search --locked --no-verify \
            --target-dir '${{ runner.temp }}/crate-publish'
          candidate=$(find '${{ runner.temp }}/crate-publish/package' -maxdepth 1 -name '*.crate' -print -quit)
          attested=$(find dist -maxdepth 1 -name '*.crate' -print -quit)
          test -n "$candidate" && test -n "$attested"
          cmp "$attested" "$candidate"
      - name: Detect a crates.io publication this job already completed
        id: crate-state
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "ai-session-search") | .version')
          test -n "$version"
          attested=$(find dist -maxdepth 1 -name '*.crate' -print -quit)
          test -n "$attested"
          response="${RUNNER_TEMP}/crates-io-version.json"
          http_status=$(curl -sS -o "$response" -w '%{http_code}' \
            -H 'User-Agent: ai-session-search release workflow (https://github.com/ahundt/ai-session-search)' \
            "https://crates.io/api/v1/crates/ai-session-search/${version}")
          if [ "$http_status" = '404' ]; then
            echo 'published=false' >> "$GITHUB_OUTPUT"
            echo "ai-session-search ${version} is not on crates.io. Publishing."
            exit 0
          fi
          if [ "$http_status" != '200' ]; then
            echo "::error::crates.io returned HTTP ${http_status} for ai-session-search ${version}. Cannot tell whether this version is published; refusing to publish blind."
            exit 1
          fi
          registry=$(jq -r '.version.checksum // empty' "$response")
          local=$(sha256sum "$attested" | cut -d ' ' -f 1)
          if [ "$registry" != "$local" ]; then
            echo "::error::ai-session-search ${version} is already on crates.io with sha256 ${registry}, but the attested crate is ${local}. Registry versions are immutable, so publish a new version instead of replacing this one."
            exit 1
          fi
          echo 'published=true' >> "$GITHUB_OUTPUT"
          echo "ai-session-search ${version} is already on crates.io with the attested checksum ${registry}. Skipping publication so a retry can reach the remaining jobs."
      - name: Acquire a short-lived crates.io publishing token
        id: crates-io-auth
        if: steps.crate-state.outputs.published != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Publish the public Rust crate from the verified tag
        if: steps.crate-state.outputs.published != 'true'
        run: cargo publish --locked -p ai-session-search
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  publish-testpypi:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  publish:
    needs: [verify, publish-crate]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          attestations: true

  release:
    needs: [verify, publish-crate, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-python-distributions
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-native-distributions
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-crate-distribution
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-release-metadata
          path: dist
      # Outside dist/, whose whole contents become release assets.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-notes
          path: notes
      - name: Publish the exact verified and attested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        # The metadata gate pins the tag to the PEP 440 spelling of the pyproject
        # version (v1.0.0rc1), so pre-releases are detected by PEP 440 pre/dev
        # suffixes (rcN, aN, bN, dev) as well as the SemVer hyphen form. A final
        # release (v1.0.0) matches none of these, keeping "Latest release" pointed
        # at the newest final version instead of an RC.
        run: |
          case "${GITHUB_REF_NAME#v}" in
            *-*|*rc[0-9]*|*a[0-9]*|*b[0-9]*|*dev*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          # This job never checks out the repository, so gh has no git remote to
          # infer the target from and exits 1 with "not a git repository". Every
          # operation here is API-backed, including --verify-tag, which checks the
          # remote tag, so naming the repository is enough and a checkout is not.
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --notes-file notes/release-notes.md $prerelease
