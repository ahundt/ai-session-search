name: Build and publish Python distributions

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_CYCLONEDX_VERSION: 0.5.9
  UV_VERSION: 0.11.28

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Require tag and package versions to match
        shell: bash
        run: |
          package_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          tag_version=${GITHUB_REF_NAME#v}
          test "$tag_version" = "$package_version" || {
            echo "tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          }

  wheels:
    needs: [test, metadata]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: '2014'
          - os: ubuntu-latest
            target: aarch64
            manylinux: '2014'
          - os: macos-14
            target: aarch64
            manylinux: auto
          - os: macos-13
            target: x86_64
            manylinux: auto
          - os: windows-latest
            target: x64
            manylinux: auto
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          command: build
          args: --release --locked --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: [test, metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: sdist
          args: --out dist
      - name: Build and smoke-test the exact sdist in isolation
        shell: bash
        run: |
          sdist=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          uv run --isolated --no-project --with "$sdist" \
            python scripts/verify_installed_distribution.py \
              --source-root "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  sbom:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: ${{ env.UV_VERSION }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - name: Generate locked Python dependency SBOM
        run: |
          mkdir sbom
          uv export --locked --no-dev --format cyclonedx1.5 \
            --output-file sbom/ai-session-search-python-runtime.cdx.json
      - name: Generate locked Rust dependency SBOMs
        shell: bash
        run: |
          cargo install cargo-cyclonedx \
            --version "$CARGO_CYCLONEDX_VERSION" --locked
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            cargo cyclonedx --manifest-path Cargo.toml --format json \
              --spec-version 1.5 --target all --all-features --all
          find rust -maxdepth 3 -name '*.cdx.json' -exec cp '{}' sbom/ ';'
          test "$(find sbom -maxdepth 1 -name '*.cdx.json' | wc -l)" -eq 3
          python scripts/sanitize_sboms.py --root "$GITHUB_WORKSPACE" \
            --source-date-epoch "$(git log -1 --format=%ct)" sbom/*.cdx.json
          if grep -R -F 'path+file://' sbom; then
            echo "machine-local path leaked into SBOM" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-sboms
          path: sbom/*.cdx.json
          if-no-files-found: error

  verify:
    needs: [wheels, sdist, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: 'wheel-*'
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sdist
          path: dist
      - run: python scripts/verify_release_artifacts.py dist/*
      - run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distribution-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
