[package]
name = "sessiongrep"
version = "0.1.0"
edition = "2021"
description = "Local-first search, inspection, export, and resume for Claude Code, Codex, Cursor, Antigravity, and Pi sessions, with message-level search, corrections/planning analytics, file-version recovery, and an MCP server for agent-driven recall."
license = "Apache-2.0"
repository = "https://github.com/braincompany/sessiongrep"
readme = "README.md"
keywords = ["cli", "search", "claude", "codex", "cursor"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0"
edtf = { version = "0.2.0", features = ["chrono"] }
fd-lock = "4.0"
fuzzy-matcher = "0.3"
ignore = "0.4"
interim = { version = "0.2.1", features = ["chrono_0_4"] }
linkify = "0.10"
nucleo-matcher = "0.3.1"
ratatui = "0.29"
rayon = "1.11"
regex = "1.12"
regex-syntax = "0.8"
rusqlite = { version = "0.37", features = ["bundled", "chrono", "hooks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "1.3"
thiserror = "2.0"
toml = "0.9"
url = "2.5"

[[bin]]
name = "sessiongrep"
path = "src/main.rs"

[[bin]]
name = "sessiongrep-mcp"
path = "src/mcp.rs"

[dev-dependencies]
tempfile = "3.23"
