[package]
name = "ai-session-search-python"
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]
abi3 = ["pyo3/abi3-py312"]

[dependencies]
pyo3 = "0.29"
ai-session-search = { path = "../ai-session-search-core" }
