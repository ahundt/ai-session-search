[package]
name = "ai-session-search-python"
version = "1.0.0-rc.1"
edition.workspace = true
rust-version.workspace = true
description = "Typed PyO3 bindings for AI Session Search"
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[features]
default = []
extension-module = ["pyo3/extension-module"]
abi3 = ["pyo3/abi3-py312"]

[dependencies]
anyhow = "1.0"
pyo3 = "0.29"
chrono = "0.4"
serde = "1.0"
serde_json = "1.0"
ai-session-search = { version = "1.0.0-rc.1", path = "../ai-session-search-core" }
