[package]
name = "ai-session-search"
version = "1.0.1"
edition = "2021"
rust-version.workspace = true
description = "Local-first search, inspection, export, recovery, and MCP recall across supported AI coding-agent sessions."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ai-session-search"
readme = "README.md"
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "NOTICE",
    "README.md",
    "config.example.toml",
    "harness-environment.txt",
    "examples/**",
    "skills/**",
    "src/**",
    "tests/**",
]
keywords = ["cli", "search", "claude", "codex", "cursor"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "7.0"
edtf = { version = "0.2.0", features = ["chrono"] }
fd-lock = "4.0"
file-id = "0.2.3"
fuzzy-matcher = "0.3"
ignore = "0.4"
interim = { version = "0.2.1", features = ["chrono_0_4", "jiff_0_2"] }
# IANA time zones for date input without an offset: reads the system tz database (TZ env,
# /etc/localtime; bundled on Windows) and resolves daylight-saving gaps and folds with RFC 5545's
# "compatible" rule. chrono leaves gaps to the caller and chrono-tz embeds a database snapshot.
jiff = "0.2.38"
# Edits JSONC client configs (Zed settings.json, VS Code mcp.json, kilo.jsonc) without dropping
# their comments; `serde` reads them into serde_json values for status checks.
jsonc-parser = { version = "0.34", default-features = false, features = ["cst", "serde"] }
linkify = "0.11"
nucleo-matcher = "0.3.1"
# `unstable-rendered-line-info` gates `Paragraph::line_count`, which the preview uses to bound
# scrolling by the rows the renderer actually produced. Upstream marks it
# `#[instability::unstable(feature = "rendered-line-info", issue = ".../ratatui/issues/293")]`
# and notes "The design for text wrapping is not stable and might affect this API", so it sits
# outside ratatui's semver guarantee and a 0.30.x release could move it. Taken knowingly: the
# alternative is counting wrapped rows ourselves, and clamping against a count the renderer did
# not produce is the defect this replaced -- it pulled a reader out of a word-wrapped tail.
# Failure would be a build error, not wrong output, and Cargo.lock plus `--locked` keeps our own
# builds and published artifacts on the resolved 0.30.2.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
rayon = "1.11"
regex = "1.12"
regex-syntax = "0.8"
rmcp = { version = "3.4.0", default-features = false, features = ["server", "transport-io"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
rusqlite = { version = "0.41.1", features = ["backup", "bundled", "chrono", "functions", "hooks"] }
serde = { version = "1.0", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = { version = "1.0", features = ["raw_value"] }
serde_path_to_error = "0.1.20"
semver = "1.0"
sha2 = "0.11"
shlex = "2.0"
strsim = "0.11"
thiserror = "2.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "sync"] }
toml = "1.1"
toml_edit = "0.25.12"
ureq = { version = "3.3", default-features = false, features = ["json", "platform-verifier", "rustls"], optional = true }
url = "2.5"
yaml-rust2 = { version = "0.13", default-features = false }
zstd = { version = "0.14.3", default-features = false }

[features]
default = ["release-check"]
release-check = ["dep:ureq"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[[bin]]
name = "aise"
path = "src/main.rs"

[dev-dependencies]
rmcp = { version = "3.4.0", default-features = false, features = ["client", "server", "transport-async-rw"] }
tempfile = "3.23"
tokio = { version = "1.48", features = ["io-util", "rt-multi-thread", "time"] }
