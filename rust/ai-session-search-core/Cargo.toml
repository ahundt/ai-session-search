[package]
name = "ai-session-search"
version = "1.0.0"
edition = "2021"
rust-version.workspace = true
description = "Local-first search, inspection, export, and resume for Claude Code, Codex, Cursor, Antigravity, and Pi sessions, with message-level search, corrections/planning analytics, file-version recovery, and an MCP server for agent-driven recall."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["cli", "search", "claude", "codex", "cursor"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0"
edtf = { version = "0.2.0", features = ["chrono"] }
fd-lock = "4.0"
fuzzy-matcher = "0.3"
ignore = "0.4"
interim = { version = "0.2.1", features = ["chrono_0_4"] }
linkify = "0.10"
nucleo-matcher = "0.3.1"
ratatui = "0.29"
rayon = "1.11"
regex = "1.12"
regex-syntax = "0.8"
rusqlite = { version = "0.37", features = ["backup", "bundled", "chrono", "hooks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shlex = "1.3"
thiserror = "2.0"
toml = "0.9"
url = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[[bin]]
name = "aise"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.23"
