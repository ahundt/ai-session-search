[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "ai-session-search"
version = "1.0.0rc1"
description = "Search, inspect, analyze, export, and recover AI coding-agent sessions"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Andrew Hundt", email = "ATHundt@gmail.com"}
]
keywords = ["claude", "ai-studio", "gemini", "sessions", "analysis", "jsonl", "recovery", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "maturin==1.9.4",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
aise = "ai_session_search.entrypoint:cli_main"

[project.urls]
Homepage = "https://github.com/ahundt/ai-session-search"
Documentation = "https://github.com/ahundt/ai-session-search/blob/main/README.md"
Repository = "https://github.com/ahundt/ai-session-search"
Issues = "https://github.com/ahundt/ai-session-search/issues"
Changelog = "https://github.com/ahundt/ai-session-search/releases"

[tool.maturin]
manifest-path = "rust/ai-session-search-python/Cargo.toml"
python-source = "."
module-name = "ai_session_search._native"
bindings = "pyo3"
features = ["extension-module", "abi3"]
include = [
    {path = "LICENSE", format = "sdist"},
    {path = "NOTICE", format = "sdist"},
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# Default: skip @pytest.mark.integration tests (they scan real ~/.claude data, ~3 min).
# Run all tests including integration with: uv run pytest -m "" or uv run pytest --run-integration
addopts = "-v --tb=short --strict-markers -m 'not integration'"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["ai_session_search"]
branch = true
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 160
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "tests/aise-demo",
    "venv",
    ".tox",
    ".pytest_cache",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "W191",  # indentation contains tabs
]

[tool.ruff.lint.isort]
known-first-party = ["ai_session_search"]

[tool.mypy]
python_version = "3.12"
exclude = ["^tests/aise-demo/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
