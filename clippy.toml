# Standard pathways for dates and times. CI runs clippy with -D warnings, so a call listed here
# fails the build with its reason. A sanctioned exception carries
# #[allow(clippy::disallowed_methods)] at the call site with a comment naming why: the pathway
# itself in util.rs, user-facing input in dates.rs (deliberately permissive), or a harness's own
# on-disk format in its provider.
disallowed-methods = [
    { path = "chrono::DateTime::parse_from_rfc3339", reason = "read stored timestamps with util::parse_datetime; parse --since/--until/--when input with dates.rs" },
    { path = "chrono::DateTime::parse_from_str", reason = "read stored timestamps with util::parse_datetime; parse user input with dates.rs; a harness's on-disk format is parsed in its provider with an #[allow] naming the format" },
    { path = "chrono::NaiveDateTime::parse_from_str", reason = "read stored timestamps with util::parse_datetime; parse user input with dates.rs; a harness's on-disk format is parsed in its provider with an #[allow] naming the format" },
    { path = "chrono::NaiveDate::parse_from_str", reason = "read stored timestamps with util::parse_datetime; parse user input with dates.rs; a harness's on-disk format is parsed in its provider with an #[allow] naming the format" },
    { path = "chrono::DateTime::from_timestamp", reason = "convert Unix time with util::parse_unix_seconds or util::parse_unix_nanos" },
    { path = "chrono::DateTime::from_timestamp_millis", reason = "convert Unix time with util::parse_unix_millis" },
    { path = "chrono::DateTime::from_timestamp_micros", reason = "convert Unix time with util::parse_unix_seconds, parse_unix_millis or parse_unix_nanos" },
    { path = "chrono::DateTime::from_timestamp_nanos", reason = "convert Unix time with util::parse_unix_nanos" },
    { path = "chrono::TimeZone::timestamp_opt", reason = "convert Unix time with util::parse_unix_seconds or util::parse_unix_nanos" },
    { path = "chrono::TimeZone::timestamp_millis_opt", reason = "convert Unix time with util::parse_unix_millis" },
    { path = "chrono::TimeZone::timestamp_nanos", reason = "convert Unix time with util::parse_unix_nanos" },
    { path = "chrono::DateTime::to_rfc3339", reason = "write timestamps stored in SQLite with util::stored_timestamp and timestamp text for output with util::display_timestamp" },
    { path = "chrono::DateTime::to_rfc3339_opts", reason = "write timestamps stored in SQLite with util::stored_timestamp and timestamp text for output with util::display_timestamp; an upper SQL time bound uses db.rs until_bound_text" },
]

# Content digests. Every SHA-256 goes through rust/ai-session-search-core/src/hashing.rs, so the
# algorithm, hex encoding, and value framing cannot differ between two digests that are compared.
# When this fires, call the hashing.rs function that fits; if none does, add one there with a test.
disallowed-types = [
    { path = "sha2::Sha256", reason = "hash bytes with hashing::sha256, a reader or file with hashing::sha256_reader, and a sequence of values with hashing::FramedSha256; if none fits, add a function to hashing.rs instead of an #[allow]" },
]
