[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
# Security vulnerabilities deny the build with no exceptions. Unmaintained and
# yanked notices are recorded here individually so that adding a dependency
# cannot silently inherit one.
ignore = [
    # `paste` is a build-time proc macro with no runtime code path and no
    # security vulnerability; the advisory only records that its author archived
    # the repository. It reaches this workspace solely through ratatui 0.29,
    # which pins it. Remove this entry when the TUI moves to ratatui 0.30, whose
    # dependency graph drops `paste`.
    "RUSTSEC-2024-0436",
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
